<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bunny Bites | Produtos</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body class="page-products">
    <main class="protected-page container">
        <h1>Produtos Bunny Bites</h1>
        <p>Explore nosso catalogo completo e escolha suas delicias favoritas.</p>

        <section class="catalog-toolbar" aria-label="Filtros do catalogo">
            <div class="catalog-filters" role="group" aria-label="Filtrar por categoria">
                <button class="btn btn-soft is-active" type="button" data-catalog-filter="all">Todos</button>
                <button class="btn btn-soft" type="button" data-catalog-filter="ovos">Ovos</button>
                <button class="btn btn-soft" type="button" data-catalog-filter="recheados">Recheados</button>
                <button class="btn btn-soft" type="button" data-catalog-filter="kits">Kits</button>
                <button class="btn btn-soft" type="button" data-catalog-filter="especiais">Especiais</button>
            </div>
            <div class="catalog-search">
                <input id="catalogSearch" type="search" data-catalog-search placeholder="Buscar por nome do produto"
                    aria-label="Buscar por nome do produto" />
            </div>
            <div class="catalog-sort">
                <label for="catalogSort">Ordenar por</label>
                <select id="catalogSort" data-catalog-sort aria-label="Ordenar produtos">
                    <option value="featured">Destaques</option>
                    <option value="name-asc">Nome (A-Z)</option>
                    <option value="name-desc">Nome (Z-A)</option>
                    <option value="price-asc">Menor preco</option>
                    <option value="price-desc">Maior preco</option>
                </select>
            </div>
            <p class="catalog-status" id="catalogStatus" aria-live="polite"></p>
        </section>

        <section class="section-block">
            <div class="product-grid" data-catalog-grid>
                <article class="product-card">
                    <h3>Carregando catalogo...</h3>
                    <p class="price-tag">Aguarde alguns instantes.</p>
                </article>
            </div>
        </section>

        <nav class="catalog-pagination" aria-label="Paginacao de produtos">
            <button class="btn btn-soft" type="button" data-page-prev>Anterior</button>
            <span class="catalog-page-indicator" data-page-indicator>Pagina 1 de 1</span>
            <button class="btn btn-soft" type="button" data-page-next>Proxima</button>
        </nav>

        <div class="protected-actions">
            <a class="btn btn-soft" href="index.html">Voltar para home</a>
            <a class="btn btn-soft" href="product-details.html">Ver detalhes de um produto</a>
            <a class="btn btn-primary" href="cart.html" data-protected-target="cart.html"
                data-protected-message="Faca login para adicionar produtos ao carrinho.">Adicionar ao carrinho</a>
        </div>
    </main>
    <script src="auth-config.js"></script>
    <script src="script.js"></script>
</body>

</html>
