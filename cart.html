<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bunny Bites | Carrinho</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body data-protected-page="true">
    <main class="protected-page container">
        <h1>Carrinho</h1>
        <p>Area protegida para revisar os itens antes de finalizar.</p>

        <section class="section-block">
            <div class="product-grid">
                <article class="product-card">
                    <img class="product-media" src="assets/images/products/product-1.jpg" alt="Ovo classico no carrinho"
                        loading="lazy" />
                    <h3>Ovo de Chocolate Classico</h3>
                    <p class="price-tag">Qtd: 1 • R$ 74,90</p>
                </article>
                <article class="product-card">
                    <img class="product-media" src="assets/images/products/product-2.jpg" alt="Ovo recheado no carrinho"
                        loading="lazy" />
                    <h3>Ovo Recheado de Brigadeiro</h3>
                    <p class="price-tag">Qtd: 1 • R$ 99,90</p>
                </article>
            </div>
        </section>

        <div class="protected-actions">
            <a class="btn btn-soft" href="products.html">Continuar comprando</a>
            <a class="btn btn-primary" href="checkout.html" data-protected-target="checkout.html"
                data-protected-message="Entre para continuar ao checkout.">Finalizar compra</a>
            <a class="btn btn-soft" href="#" data-auth-logout>Sair</a>
        </div>
    </main>
    <script src="auth-config.js"></script>
    <script src="script.js"></script>
</body>

</html>
