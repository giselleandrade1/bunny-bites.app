<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bunny Bites | Checkout</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body data-protected-page="true">
    <main class="protected-page container">
        <h1>Checkout</h1>
        <p>Area protegida para concluir seu pedido com seguranca.</p>

        <section class="section-block">
            <div class="product-grid">
                <article class="product-card">
                    <img class="product-media" src="assets/images/products/product-1.jpg"
                        alt="Item do pedido no checkout" loading="lazy" />
                    <h3>Ovo de Chocolate Classico</h3>
                    <p class="price-tag">Subtotal: R$ 74,90</p>
                </article>
                <article class="product-card">
                    <img class="product-media" src="assets/images/products/product-2.jpg"
                        alt="Segundo item do pedido no checkout" loading="lazy" />
                    <h3>Ovo Recheado de Brigadeiro</h3>
                    <p class="price-tag">Subtotal: R$ 99,90</p>
                </article>
            </div>
        </section>

        <section class="section-block" aria-label="Dados para concluir pedido">
            <form id="checkoutForm" class="auth-form" novalidate>
                <label class="field">
                    <span>Nome completo</span>
                    <input id="checkoutName" type="text" placeholder="Nome e sobrenome" required />
                </label>

                <label class="field">
                    <span>Endereco de entrega</span>
                    <input id="checkoutAddress" type="text" placeholder="Rua, numero e complemento" required />
                </label>

                <label class="field">
                    <span>Cidade</span>
                    <input id="checkoutCity" type="text" placeholder="Sua cidade" required />
                </label>

                <label class="field">
                    <span>Forma de pagamento</span>
                    <select id="checkoutPayment" required>
                        <option value="">Selecione</option>
                        <option value="credit">Cartao de credito</option>
                        <option value="pix">PIX</option>
                    </select>
                </label>
            </form>
        </section>

        <div class="protected-actions">
            <a class="btn btn-soft" href="cart.html">Voltar ao carrinho</a>
            <button class="btn btn-primary" data-confirm-order data-protected-target="checkout.html"
                data-protected-message="Entre para confirmar seu pedido.">Finalizar pedido</button>
            <a class="btn btn-soft" href="#" data-auth-logout>Sair</a>
        </div>
    </main>
    <script src="auth-config.js"></script>
    <script src="script.js"></script>
</body>

</html>
