<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bunny Bites | Contato</title>
    <meta name="description" content="Entre em contato com a Bunny Bites para suporte e duvidas." />
    <link rel="stylesheet" href="style.css" />
</head>

<body class="page-contact">
    <main class="container protected-page">
        <h1>Contato</h1>
        <p>Estamos aqui para ajudar com pedidos, prazos e informacoes dos produtos.</p>

        <section class="section-block">
            <form id="contactForm" class="auth-form" novalidate>
                <label class="field">
                    <span>Nome completo</span>
                    <input id="contactName" type="text" placeholder="Seu nome e sobrenome" required />
                </label>

                <label class="field">
                    <span>E-mail</span>
                    <input id="contactEmail" type="email" placeholder="voce@exemplo.com" required />
                </label>

                <label class="field">
                    <span>Mensagem</span>
                    <textarea id="contactMessage" placeholder="Como podemos ajudar?" rows="5" required></textarea>
                </label>

                <p id="contactStatus" class="status-message" role="status" aria-live="polite"></p>

                <div class="protected-actions">
                    <button class="btn btn-primary" type="submit">Enviar mensagem</button>
                    <a class="btn btn-soft" href="index.html">Voltar para home</a>
                </div>
            </form>
        </section>
    </main>

    <script src="auth-config.js"></script>
    <script src="script.js"></script>
</body>

</html>
